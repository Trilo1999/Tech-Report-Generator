version: "3.8"

services:
  # ────────────────────────────────────────────────────────────
  # Qdrant Vector Database (Includes Web UI at http://localhost:6333/dashboard)
  # ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: research_agent_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__ENABLE_CORS=true
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # PostgreSQL 16 (Persistent Checkpointer for LangGraph)
  # ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: research_agent_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: research_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # Redis 7 (Conversation Memory & High-Performance Caching)
  # ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: research_agent_redis
    restart: unless-stopped
    command: redis-server --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ────────────────────────────────────────────────────────────
  # Research Agent Service (FastAPI + LangGraph)
  # ────────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_agent_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_URL=postgresql://postgres:postgrespassword@postgres:5432/research_agent
      - REDIS_HOST=redis
    volumes:
      - ./app:/app/app
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────
  # Website & Frontend UI (Docusaurus + AI Research Console)
  # ────────────────────────────────────────────────────────────
  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: research_agent_website
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - agent

volumes:
  qdrant_data:
    name: research_agent_qdrant_data
  postgres_data:
    name: research_agent_postgres_data
  redis_data:
    name: research_agent_redis_data
