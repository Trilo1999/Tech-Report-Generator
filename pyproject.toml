[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-web-starter"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=0.2.17",
    "langchain-community>=0.2.19",
    "langchain-openai>=0.1.21",
    "langchain_huggingface>=0.0.3",
    "langchain_qdrant>=0.1.3",
    "langchain_text_splitters>=0.2.0,<0.4.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "langgraph-checkpoint>=2.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymupdf>=1.24.0",
    "pypdf>=5.0.0",
    "pandas>=2.2.0",
    "reportlab>=4.2.0",
    "python-docx>=1.1.0",
    "fastembed>=0.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "qdrant_client>=1.12.0",
    "redis>=5.0.0",
    "aio-pika>=9.4.0",
    "gunicorn>=23.0.0",
    "uvicorn>=0.32.0",
    "PyJWT>=2.8.0",
    "passlib[argon2]>=1.7.4",
    "langchain-google-genai>=1.0.8",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.8.4",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pytest==9.0.2",
    "httpx==0.28.1",
]

[tool.isort]
profile = "black"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
# Allowed types for Conventional Commits
# feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["temp*"]
